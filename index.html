<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List App</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container my-5">
    <div class="card shadow-lg">
      <div class="card-body">
        <h1 class="text-center text-primary mb-4">✨ My Todo List ✨</h1>

        <!-- Input and button -->
        <div class="input-group mb-3">
          <input type="text" id="todo-input" class="form-control" placeholder="Enter a task and press Add or Enter">
          <button id="add-btn" class="btn btn-success">Add</button>
        </div>

        <!-- Todo List -->
        <ul id="todo-list" class="list-group"></ul>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your JS file -->
  <script src="script.js"></script>
</body>
</html>
